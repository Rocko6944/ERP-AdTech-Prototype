<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso | ERP Adtech</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel card">
        <div>
          <p>e SUBIR IMAGEN LOGIN</p>
          <h1>Iniciar Sesión</h1>
          <p>Accede al módulo y descubre un prototipo ERP corporativo, limpio y responsivo.</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <div class="input-group">
            <label for="email">Usuario</label>
            <input id="email" type="email" name="email" placeholder="usuario@empresa.com" required />
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" placeholder="••••••••" required />
          </div>

          <div class="checkbox-group">
            <input id="remember" type="checkbox" name="remember" />
            <label for="remember">Recordar contraseña</label>
          </div>

          <button type="submit" class="primary-button">Ingresar</button>

          <div class="auth-footer">
            <span>¿Olvidaste tu contraseña?</span>
            <span>ERP Adtech</span>
          </div>
        </form>
      </section>

      <aside class="image-panel card">
        <div class="image-placeholder">
          <span>SUBIR IMAGEN LOGIN</span>
        </div>
      </aside>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
